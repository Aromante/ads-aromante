@if (auth.isAuthenticated) {
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="logo">&#9670;</span>
        <span class="name">Ads Aromante</span>
      </div>
      <nav>
        <div class="nav-divider"><span>Operaci&oacute;n</span></div>
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>

        <div class="nav-divider"><span>An&aacute;lisis</span></div>
        <a routerLink="/attribution" routerLinkActive="active">Atribuci&oacute;n</a>
        <a routerLink="/maturation" routerLinkActive="active">Maduraci&oacute;n</a>
        <a routerLink="/frequency" routerLinkActive="active">Frecuencia</a>

        <div class="nav-divider"><span>Sistema</span></div>
        <a routerLink="/duplicates" routerLinkActive="active">Duplicados</a>
        <a routerLink="/health" routerLinkActive="active">Salud Ingesta</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-email">{{ auth.user()?.email }}</div>
        <button class="logout-btn" (click)="logout()">Cerrar sesi&oacute;n</button>
      </div>
    </aside>
    <main class="content">
      <router-outlet />
    </main>
  </div>
} @else {
  <router-outlet />
}
